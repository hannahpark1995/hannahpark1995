<defs><style>@font-face{font-family:'Mono';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Bub';src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'Ser';src:url(data:font/woff;base64,) format('woff')}
.f1{animation:f1 7s ease-in-out infinite alternate}.f2{animation:f2 9s ease-in-out infinite alternate}.f3{animation:f3 11s ease-in-out infinite alternate}
